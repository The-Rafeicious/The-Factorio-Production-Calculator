<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smelting Menu</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <form method="POST" class="form-smelting">
        <h2 class="form-group">Smelting Menu</h2>

        <div class="form-group">
            <label for="ore">Select an ore</label>
            <select id="ore" name="ore_type" required>
                <option value="" disabled selected>Select an ore</option>
                <option value="iron plate">Iron ore --> Iron plate</option>
                <option value="copper plate">Copper ore --> Copper plate</option>
                <option value="steel plate">Iron plate --> Steel plate</option>
                <option value="stone brick">Stone ore --> Stone brick</option>
            </select>
        </div>

        <div class="form-group">
            <label for="belt">Select a belt</label>
            <select id="belt" name="belt_type" required>
                <option value="" disabled selected>Select a belt</option>
                <option value="yellow">Yellow belt (15 i/s)</option>
                <option value="red">Red belt (30 i/s)</option>
                <option value="blue">Blue belt (45 i/s)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="belt_count">Enter belt amount</label>
            <input type="number" id="belt_count" name="belt_no" min="1" required>
        </div>

        <div class="form-group">
            <label for="furnace">Select a furnace</label>
            <select id="furnace" name="furnace_type" required>
                <option value="" disabled selected>Select a furnace</option>
                <option value="stone">Stone furnace</option>
                <option value="steel">Steel furnace</option>
                <option value="electric">Electric furnace</option>
            </select>
        </div>

        <div class="form-group">
            <input type="submit" value="Submit">
        </div>
    </form>
</body>
</html>
